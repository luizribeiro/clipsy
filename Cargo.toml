[package]
name = "clipsy"
version = "0.2.0"
edition = "2021"
description = "Sync your clipboard across machines over iroh"
license = "MIT"
repository = "https://github.com/luizribeiro/clipsy"
homepage = "https://github.com/luizribeiro/clipsy"
readme = "README.md"
keywords = ["clipboard", "iroh", "ssh", "tmux", "neovim"]
categories = ["command-line-utilities"]

[dependencies]
tokio = { version = "1", features = ["full", "macros"] }
arboard = { version = "3.7", default-features = false, features = ["wayland-data-control"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.114"
anyhow = "1"
iroh = "1"
tempfile = "3"
data-encoding = "2"
toml = "0.9"

[target.'cfg(target_os = "linux")'.dependencies]
wl-clipboard-rs = "0.9.5"
x11rb = "0.13.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSPasteboard"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSString"] }
