[package]
name = "clipsy"
version = "0.1.0"
edition = "2021"
description = "Sync your clipboard across machines over iroh"
license = "MIT"
repository = "https://github.com/luizribeiro/clipsy"
homepage = "https://github.com/luizribeiro/clipsy"
readme = "README.md"
keywords = ["clipboard", "iroh", "ssh", "tmux", "neovim"]
categories = ["command-line-utilities"]

[dependencies]
tokio = { version = "1", features = ["full", "macros"] }
arboard = { version = "3.7", default-features = false, features = ["wayland-data-control"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.114"
anyhow = "1"
iroh = "1"
tempfile = "3"
data-encoding = "2"
toml = "0.9"
